# Policy checked in CI by cargo-deny.

[advisories]
# Fail the build on any crate with a published security advisory.
yanked = "deny"
ignore = []

[licenses]
# Permissive licences only; anything else needs a deliberate exception here.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "MPL-2.0",
    "CDLA-Permissive-2.0",
]
confidence-threshold = 0.9

[bans]
# The audit found thiserror 1.x and 2.x in the same tree, plus a duplicate
# hyper pulled in by reqwest 0.11. "warn" surfaces regressions without
# blocking; tighten to "deny" once the reqwest 0.12 bump lands.
multiple-versions = "warn"
wildcards = "deny"
skip = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]

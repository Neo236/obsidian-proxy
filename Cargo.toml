[workspace]
resolver = "2"
members = [
    "crates/obsidian-protocol",
    "crates/obsidian-core",
    "crates/obsidian-web",
    "crates/obsidian-bedrock",
    "crates/obsidian-cli"
, "crates/obsidian-raknet", "crates/obsidian-plugins"]

[workspace.dependencies]
tokio = { version = "1.37.0", features = ["full"] }
bytes = "1.5.0"
axum = "0.7.5"
rusqlite = { version = "0.31.0", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
dashmap = "5.5"
arc-swap = "1.7.1"
aes = "0.8"
cfb8 = "0.8"
libdeflater = "1.19"
clap = { version = "4.5.4", features = ["derive"] }
anyhow = "1.0"
thiserror = "1.0"

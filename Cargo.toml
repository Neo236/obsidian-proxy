[workspace]
resolver = "3"
members = [
    "crates/obsidian-protocol",
    "crates/obsidian-raknet",
    "crates/obsidian-bedrock",
    "crates/obsidian-plugins",
    "crates/obsidian-core",
    "crates/obsidian-web",
    "crates/obsidian-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
repository = "https://github.com/Neo236/obsidian-proxy"
authors = ["Neo236"]

# Lints are defined once here and inherited by every crate via `[lints] workspace = true`.
[workspace.lints.rust]
unsafe_code = "forbid"
unused_crate_dependencies = "warn"
unreachable_pub = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
todo = "warn"
unimplemented = "warn"
# The audit found 82 sites where wire-supplied integers become allocation sizes
# or slice indices - exactly the class behind the RakNet fragment bug. Auditing
# them is phase 02 work, so these stay allowed for now and get promoted to
# "warn" once that pass lands. Leaving them declared keeps the intent visible.
cast_possible_truncation = "allow"
indexing_slicing = "allow"

[workspace.dependencies]
# --- internal crates ---
obsidian-protocol = { path = "crates/obsidian-protocol" }
obsidian-raknet = { path = "crates/obsidian-raknet" }
obsidian-bedrock = { path = "crates/obsidian-bedrock" }
obsidian-plugins = { path = "crates/obsidian-plugins" }
obsidian-core = { path = "crates/obsidian-core" }
obsidian-web = { path = "crates/obsidian-web" }

# --- runtime & primitives ---
tokio = { version = "1.37.0", features = ["full"] }
bytes = "1.5.0"
dashmap = "6"
thiserror = "2"
anyhow = "1.0"
arc-swap = "1.7.1"

# --- serialisation & config ---
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml_edit = { version = "0.22", features = ["serde"] }
base64 = "0.22"

# --- observability ---
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# --- java protocol: crypto, compression, auth ---
rsa = { version = "0.9", features = ["sha1"] }
aes = "0.8"
cfb8 = "0.8"
sha1 = "0.10"
md-5 = "0.11.0"
libdeflater = "1.19"
rand = "0.8"
reqwest = { version = "0.11", default-features = false, features = ["json", "rustls-tls"] }

# --- bedrock: raknet, ecdh, batching ---
p384 = "0.13"
ctr = "0.9"
sha2 = "0.10"
hmac = "0.12"
rand_core = { version = "0.6", features = ["std"] }
snap = "1"

# --- web panel ---
subtle = "2"
tower = { version = "0.5", features = ["util"] }
axum = "0.7.5"
rusqlite = { version = "0.31.0", features = ["bundled"] }
tower-http = { version = "0.5", features = ["cors", "fs"] }

# --- cli & scripting ---
clap = { version = "4.5.4", features = ["derive"] }
rhai = { version = "1.25.1", features = ["sync"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"

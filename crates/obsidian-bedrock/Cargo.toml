[package]
name = "obsidian-bedrock"
version = "0.1.0"
edition = "2024"

[dependencies]
bytes = "1"
tokio = { version = "1", features = ["full"] }
snap = "1"
libdeflater = "1.19"
thiserror = "2"
obsidian-raknet = { path = "../obsidian-raknet" }
p384 = "0.13"
aes = "0.8"
ctr = "0.9"
sha2 = "0.10"
hmac = "0.12"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
base64 = "0.22"
rand_core = { version = "0.6", features = ["std"] }

[dev-dependencies]
rand = "0.10.2"

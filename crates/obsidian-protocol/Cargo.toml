[package]
name = "obsidian-protocol"
version = "0.1.0"
edition = "2024"

[dependencies]
bytes = { workspace = true }
tokio = { workspace = true }
thiserror = { workspace = true }
anyhow = { workspace = true }
serde = { workspace = true }
serde_json = "1.0"

# Phase 1 Crypto, Compression & Auth Dependencies
rsa = { version = "0.9", features = ["sha1"] }
rand = "0.8"
sha1 = "0.10"
reqwest = { version = "0.11", default-features = false, features = ["json", "rustls-tls"] }
aes = { workspace = true }
cfb8 = { workspace = true }
libdeflater = { workspace = true }
md-5 = "0.11.0"

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt", "io-util"] }
